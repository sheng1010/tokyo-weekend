<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Things to Do in Tokyo This Weekend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./CSS/style.css" />
</head>
<body class="bg-gray-50 text-gray-900" data-page="home">
  <div id="header"></div>

  <section class="bg-white py-16">
    <div class="max-w-6xl mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4" data-i18n="home.heroTitle">
        What to Do in Tokyo This Weekend
      </h1>
      <p class="text-gray-600 mb-6 max-w-2xl mx-auto" data-i18n="home.heroSubtitle">
        Find film screenings, exhibitions, nightlife and useful event picks in Tokyo.
      </p>
      <input
        type="text"
        placeholder="Search events..."
        data-i18n-placeholder="home.searchPlaceholder"
        class="border rounded-lg px-4 py-3 w-full max-w-md"
      />
    </div>
  </section>

  <section class="max-w-6xl mx-auto py-12 px-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold" data-i18n="home.topPicksTitle">Top Picks This Weekend</h2>
      <a href="./pages/activities.html" class="text-red-500 text-sm hover:underline" data-i18n="common.viewAll">View all</a>
    </div>

    <div id="top-picks-container" class="grid grid-cols-4 gap-4 items-stretch"></div>
  </section>

  <footer class="text-center text-gray-500 py-8 text-sm" data-i18n="common.footer">
    Tokyo Weekend Guide © 2026
  </footer>

  <script src="./Js/main.js"></script>
  <script type="module">
    import { bootstrapPage } from "./Js/firebase-auth.js";
    await bootstrapPage("home");
  </script>
</body>
</html>
