<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Things to Do in Tokyo This Weekend</title>
  <meta name="description" content="What to do in Tokyo this weekend: films, exhibitions, nightlife, and activities that still have a confirmed date." />
  <link rel="canonical" href="https://tokyo-weekend.vercel.app/" />
  <meta property="og:site_name" content="Tokyo Weekend" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Things to Do in Tokyo This Weekend" />
  <meta property="og:description" content="What to do in Tokyo this weekend: films, exhibitions, nightlife, and activities that still have a confirmed date." />
  <meta property="og:url" content="https://tokyo-weekend.vercel.app/" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./CSS/style.css" />
</head>
<body class="bg-gray-50 text-gray-900" data-page="home">
  <div id="header"></div>

  <section class="bg-white py-16">
    <div class="max-w-6xl mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4" data-i18n="home.heroTitle">
        What to Do in Tokyo This Weekend
      </h1>
      <p class="text-gray-600 mb-6 max-w-2xl mx-auto" data-i18n="home.heroSubtitle">
        Find film screenings, exhibitions, nightlife and useful event picks in Tokyo.
      </p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center items-stretch max-w-xl mx-auto">
        <input
          id="event-search"
          type="search"
          placeholder="Search events..."
          data-i18n-placeholder="home.searchPlaceholder"
          class="border rounded-lg px-4 py-3 w-full bg-white"
        />
        <button
          id="weekend-filter"
          type="button"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm font-semibold bg-white shrink-0"
          aria-pressed="true"
          data-i18n="common.thisWeekend"
        >
          This weekend
        </button>
      </div>
    </div>
  </section>

  <section class="max-w-6xl mx-auto py-12 px-4">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
      <h2 class="text-2xl font-bold" id="home-results-title" data-i18n="home.topPicksTitle">Top Picks This Weekend</h2>
      <a id="home-view-all" href="/pages/all.html?when=weekend" class="text-red-500 text-sm hover:underline shrink-0" data-i18n="common.viewAll">View all</a>
    </div>

    <div id="top-picks-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-stretch"></div>
  </section>

  <footer class="text-center text-gray-500 py-8 text-sm" data-i18n="common.footer">
    Tokyo Weekend Guide © 2026
  </footer>

  <script src="./Js/main.js"></script>
  <script type="module">
    import { bootstrapPage } from "./Js/firebase-auth.js";
    await bootstrapPage("home");
  </script>
</body>
</html>
